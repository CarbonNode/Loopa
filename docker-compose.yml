services:
  loopa:
    build:
      context: .
      dockerfile: Dockerfile
    image: loopa:latest
    container_name: loopa
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Loopback by default: Cloudflare Tunnel is the only public path in, and
      # the tunnel reaches the app through the shared network namespace below
      # rather than through this published port.
      #
      # Set LOOPA_BIND_ADDR=0.0.0.0 to also serve the LAN directly — useful
      # before a tunnel exists, or for watching clips at home without egressing
      # to Cloudflare and back. It is still behind login either way.
      - "${LOOPA_BIND_ADDR:-127.0.0.1}:8080:8080"
    volumes:
      # The library. Override LOOPA_MEDIA_HOST_DIR to point at a big disk —
      # on super_server that means something like X:/loopa-media.
      - ${LOOPA_MEDIA_HOST_DIR:-./media}:/app/media
      - ${LOOPA_DATA_HOST_DIR:-./data}:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      # Matches the Dockerfile: type-stripping ~200 modules at boot measured
      # ~25s on a slow filesystem, and a short window restart-loops a healthy
      # server that is merely still starting.
      start_period: 90s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: loopa-cloudflared
    restart: unless-stopped
    # Opt-in: `docker compose --profile tunnel up -d`. Without this the sidecar
    # would start with an empty TUNNEL_TOKEN on any plain `up` and crash-loop.
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # Token from the Cloudflare Zero Trust dashboard for the Loopa tunnel.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      loopa:
        condition: service_healthy
    network_mode: "service:loopa"
